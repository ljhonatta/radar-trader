name: Narrar vídeo

on:
  schedule:
    # 7h40 de Brasília, depois da coleta das 6h45 (o GitHub usa UTC; pode atrasar alguns minutos)
    - cron: "40 10 * * *"
  workflow_dispatch:
    inputs:
      noticia_id:
        description: "ID da notícia (vazio = a mais importante do dia)"
        default: ""

permissions:
  contents: write

concurrency:
  group: narrar
  cancel-in-progress: false

jobs:
  narrar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coletor/requirements.txt
      - run: pip install -r coletor/requirements.txt
      - name: Narrar
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL_ESCRITA: ${{ vars.OPENAI_MODEL_ESCRITA }}
          NARRAR_VOZ: ${{ vars.NARRAR_VOZ }}
          NARRAR_MODELO: ${{ vars.NARRAR_MODELO }}
          NARRAR_PERFIL: ${{ vars.NARRAR_PERFIL }}
          NARRAR_POR_DIA: ${{ vars.NARRAR_POR_DIA }}
          NOTICIA_ID: ${{ inputs.noticia_id }}
        run: python coletor/narrar.py
      - name: Salvar no repositório
        run: |
          git config user.name "radar-trader-bot"
          git config user.email "radar-trader-bot@users.noreply.github.com"
          git add docs/data/videos
          git diff --cached --quiet || git commit -m "Vídeo narrado $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          git pull --rebase --autostash && git push
