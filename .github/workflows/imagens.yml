name: Gerar imagens (capa e ícone)

on:
  workflow_dispatch:
    inputs:
      qual:
        description: "O que gerar: ambos, capa ou icone"
        default: ambos

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Gerar com a OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python coletor/imagens.py "${{ inputs.qual }}"
      - name: Salvar no repositório
        run: |
          git config user.name "radar-trader-bot"
          git config user.email "radar-trader-bot@users.noreply.github.com"
          git add docs/data/img
          git diff --cached --quiet || git commit -m "Imagens geradas com IA"
          git pull --rebase --autostash && git push
