name: Coleta Radar Trader

on:
  schedule:
    # 6h45, 12h45 e 18h45 de Brasília (o GitHub usa UTC; pode atrasar alguns minutos)
    - cron: "45 9 * * *"
    - cron: "45 15 * * *"
    - cron: "45 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: coleta-trader
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coletor/requirements.txt
      - run: pip install -r coletor/requirements.txt
      - name: Coletar
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python coletor/coletar.py
      - name: Salvar no repositório
        if: always()
        run: |
          git config user.name "radar-trader-bot"
          git config user.email "radar-trader-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Coleta $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          git pull --rebase --autostash && git push
